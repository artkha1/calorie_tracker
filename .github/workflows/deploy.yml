name: Deploy

on:
  push:
    branches: [main]

# Only run deploy after CI passes
jobs:
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"